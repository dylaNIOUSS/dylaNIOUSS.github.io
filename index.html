<html>
<head>
<title>Vote</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getFirestore, doc, collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA0dTbLOtDaw8FcsXinq_SY5SUEKNqeLgw",
    authDomain: "employee-kiosk-2bca5.firebaseapp.com",
    projectId: "employee-kiosk-2bca5",
    storageBucket: "employee-kiosk-2bca5.firebasestorage.app",
    messagingSenderId: "824085734651",
    appId: "1:824085734651:web:81e871734e37c9c6d3bc5e",
    measurementId: "G-2LP37JWFQ5"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Colors matching the pie chart slices
  const colors = [
    '#FF6384',
    '#36A2EB',
    '#FFCE56',
    '#4BC0C0',
    '#9966FF',
    '#FF9F40',
    '#C9CBCF'
  ];

  // Load the current question
  const questionRef = doc(db, "questions", "current");
  const votesCollection = collection(db, "votes");

  window.onload = () => {
    const questionElem = document.getElementById("question");
    const optionsDiv = document.getElementById("options");

    onSnapshot(questionRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        questionElem.textContent = data.questions || data.question || "Question missing";

        optionsDiv.innerHTML = "";
        data.options.forEach((opt, index) => {
          const btn = document.createElement("button");
          btn.textContent = opt;
          btn.style.backgroundColor = colors[index % colors.length];
          btn.style.color = '#fff';
          btn.style.border = 'none';
          btn.style.borderRadius = '8px';
          btn.style.boxShadow = '0 4px 8px rgba(0,0,0,0.1)';
          btn.onclick = async () => {
            await addDoc(votesCollection, {
              questionId: "current",
              choice: opt,
              timestamp: serverTimestamp()
            });
          };
          optionsDiv.appendChild(btn);
        });
      } else {
        questionElem.textContent = "No question found.";
        optionsDiv.innerHTML = "";
      }
    });
  };
</script>

  cursor: pointer; 
  transition: transform 0.2s ease;
}
button:hover {
  transform: scale(1.1);
}
</style>
</head>
